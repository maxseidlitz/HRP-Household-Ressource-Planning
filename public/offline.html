<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · WG-App</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family:
          -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
        color: #1c1c1e;
        background:
          radial-gradient(40rem 30rem at 10% -10%, #dbe7ff, transparent 60%),
          radial-gradient(40rem 30rem at 110% 10%, #f3e1ff, transparent 55%),
          #eef1f7;
      }
      main {
        margin: 1rem;
        padding: 2rem;
        max-width: 22rem;
        text-align: center;
        border-radius: 1.5rem;
        background: rgb(255 255 255 / 0.6);
        border: 1px solid rgb(255 255 255 / 0.75);
        box-shadow: 0 8px 28px rgb(30 41 59 / 0.1);
        backdrop-filter: blur(24px);
      }
      button {
        margin-top: 1rem;
        padding: 0.6rem 1.4rem;
        border: 0;
        border-radius: 999px;
        background: #0a84ff;
        color: #fff;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Keine Verbindung</h1>
      <p>
        Die WG-App braucht Internet bzw. das Heimnetz. Sobald du wieder
        verbunden bist, geht es weiter.
      </p>
      <button onclick="location.reload()">Erneut versuchen</button>
    </main>
  </body>
</html>
